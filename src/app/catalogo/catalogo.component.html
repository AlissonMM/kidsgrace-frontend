<section class="hero">
  <div class="eyebrow">Livros de RPG · dados · zines · miniaturas</div>
  <h1>MORK STORE</h1>
  <div class="sub">Achados de Mesa</div>
  <p class="flavor">Para quem já aceitou que a campanha vai terminar em morte.</p>
</section>

<div class="titulo-container">
    <h2>Produtos em <span>Destaque</span></h2>
</div>
<div class="catalog-container">
  <div class="cards-grid">
    <app-card-reut *ngFor="let produto of produtos"
                   [produto]="produto"
                   (diminuir)="diminuirQuantidade(produto)"
                   (aumentar)="aumentarQuantidade(produto)"
                   (adicionar)="adicionarItem(produto, $event)">
    </app-card-reut>
  </div>
</div>

<img *ngIf="animatingItem"
     [src]="animatingItem.imagem"
     class="animation-item"
     [ngStyle]="{'top.px': animatingItem.top, 'left.px': animatingItem.left}" />
